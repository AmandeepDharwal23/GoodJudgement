<style>
*{box-sizing:border-box}.fw{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:720px;margin:0 auto}.fc{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:24px;border:1px solid #e8e8e8;overflow:hidden}.fh{background:#1a1a2e;padding:20px 24px}.fd{display:inline-block;background:rgba(255,255,255,.15);color:#a8d8ea;font-size:11px;font-weight:600;text-transform:uppercase;padding:4px 10px;border-radius:4px;margin-bottom:10px}.fq{color:#fff;font-size:17px;font-weight:600;line-height:1.45;margin:0}.fb{padding:20px 24px}.fx{font-size:13px;color:#6b7280;line-height:1.5;margin-bottom:18px;padding:12px;background:#f9fafb;border-radius:8px;border-left:3px solid #3b82f6}.fl{font-size:12px;font-weight:600;color:#9ca3af;text-transform:uppercase;margin-bottom:12px}.sr{display:flex;align-items:center;gap:12px;margin-bottom:8px}.sl{font-size:13px;font-weight:500;color:#374151;width:120px}.si{flex:1;height:6px;-webkit-appearance:none;appearance:none;background:#e5e7eb;border-radius:3px;outline:none}.si::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#3b82f6;cursor:pointer}.sp{font-size:14px;font-weight:700;color:#1f2937;width:44px;text-align:right}.sb{width:100%;padding:12px;background:#3b82f6;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}.sb:disabled{opacity:.5;cursor:not-allowed}.ri{width:100%;min-height:50px;padding:10px;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;font-family:inherit;resize:vertical;color:#374151;box-sizing:border-box;margin-bottom:12px}.cr{display:flex;align-items:center;gap:16px;padding:14px 16px;background:#eff6ff;border-radius:10px;margin-bottom:16px;border:1px solid #dbeafe}.cv{font-size:28px;font-weight:800;color:#1d4ed8}.ci{font-size:12px;color:#6b7280;line-height:1.4}.ci b{color:#374151}.rw{display:flex;align-items:center;gap:12px;margin-bottom:8px}.rl{width:120px;font-size:13px;font-weight:500;color:#374151;text-align:right;flex-shrink:0}.rt{flex:1;height:24px;background:#f3f4f6;border-radius:6px;overflow:hidden}.rb{height:100%;border-radius:6px;transition:width .6s ease;min-width:2px}.b0{background:#3b82f6}.b1{background:#ef4444}.b2{background:#f59e0b}.b3{background:#10b981}.b4{background:#8b5cf6}.rp{width:44px;font-size:14px;font-weight:700;color:#1f2937;text-align:right}.ff{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid #f3f4f6;flex-wrap:wrap;gap:6px}.fv{font-size:12px;color:#9ca3af}.fy{font-size:12px;color:#3b82f6;font-weight:600}.fg{font-size:12px;color:#6b7280;background:none;border:1px solid #e5e7eb;border-radius:6px;padding:4px 12px;cursor:pointer}.rm{padding:10px 12px;background:#f9fafb;border-radius:8px;margin-top:8px;font-size:13px;color:#374151;border-left:3px solid #3b82f6}.rm small{display:block;font-size:11px;color:#9ca3af;margin-top:4px}
</style>
<div id="fw-root"></div>
<script>
(function(){
var S='fw_v',T='fw_t',P='fw_p',R='fw_r';
function g(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(x){return{}}}
function w(k,v){localStorage.setItem(k,JSON.stringify(v))}
function e(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}

var Q=[
{id:'q1',q:'Will Ontario allocate more than $5B CAD to infrastructure repair in the 2026-2027 budget?',dl:'Before 1 Apr 2027',o:['Yes','No'],c:'Ontario\'s infrastructure deficit is estimated at over $50B, with aging roads, water systems, and bridges.'},
{id:'q2',q:'Will Ontario experience a major infrastructure failure before January 2027?',dl:'Before 1 Jan 2027',o:['Yes','No','Uncertain'],c:'Multiple assessments have flagged critical infrastructure as at risk without immediate investment.'},
{id:'q3',q:'Which approach will best address Ontario\'s infrastructure gap over the next decade?',dl:'Long-term outlook',o:['Increased public spending','Public-private partnerships','Federal-provincial cost sharing','Municipal bond financing','Asset recycling programs'],c:'Various funding models carry different trade-offs in cost, timeline, and accountability.'},
{id:'q4',q:'Will the federal government announce a dedicated infrastructure resilience fund before October 2026?',dl:'Before 1 Oct 2026',o:['Yes','No'],c:'Extreme weather has caused billions in damage, prompting calls for climate adaptation funding.'}
];

var root=document.getElementById('fw-root');
var fw=document.createElement('div');fw.className='fw';root.appendChild(fw);
for(var i=0;i<Q.length;i++) build(Q[i]);

function build(q){
var v=g(S),p=g(P),voted=v[q.id]!=null||p[q.id]!=null;
var c=document.createElement('div');c.className='fc';c.id='fw-'+q.id;
c.innerHTML='<div class="fh"><div class="fd">'+e(q.dl)+'</div><p class="fq">'+e(q.q)+'</p></div><div class="fb">'+(q.c?'<div class="fx">'+e(q.c)+'</div>':'')+'<div class="fl">'+(voted?'Community Forecast':'What do you think?')+'</div><div class="cn"></div></div>';
var cn=c.querySelector('.cn');
voted?results(q,cn):voting(q,cn);
fw.appendChild(c);
}

function voting(q,cn){
cn.innerHTML='';
var n=q.o.length;
var vals=[];
var base=Math.floor(100/n);
for(var i=0;i<n;i++) vals[i]=base;
vals[0]=100-base*(n-1);
var h='';
for(var i=0;i<n;i++) h+='<div class="sr"><span class="sl">'+e(q.o[i])+'</span><input type="range" class="si" min="0" max="100" value="'+vals[i]+'" data-i="'+i+'"><span class="sp">'+vals[i]+'%</span></div>';
h+='<div style="text-align:right;font-size:11px;color:#9ca3af;margin-bottom:12px">Total: <b id="tot-'+q.id+'">100</b>%</div>';
h+='<textarea class="ri" placeholder="Share your reasoning (optional)..." maxlength="500"></textarea><button class="sb">Submit My Forecast</button>';
cn.innerHTML=h;
var sliders=cn.querySelectorAll('.si');
var spans=cn.querySelectorAll('.sp');
var totEl=document.getElementById('tot-'+q.id);

function rebalance(changed){
var newVal=+sliders[changed].value;
var oldVal=vals[changed];
var diff=newVal-oldVal;
if(diff===0)return;
var others=[];
for(var i=0;i<n;i++) if(i!==changed) others.push(i);
var otherSum=0;
for(var i=0;i<others.length;i++) otherSum+=vals[others[i]];
if(otherSum===0&&diff>0){newVal=oldVal;sliders[changed].value=newVal;return}
for(var i=0;i<others.length;i++){
var idx=others[i];
var share=otherSum>0?vals[idx]/otherSum:1/others.length;
var take=Math.round(diff*share);
vals[idx]=Math.max(0,vals[idx]-take);
}
vals[changed]=newVal;
var sum=0;for(var i=0;i<n;i++) sum+=vals[i];
var fix=100-sum;
if(fix!==0){for(var i=0;i<n;i++){if(i!==changed&&vals[i]+fix>=0){vals[i]+=fix;break}}}
for(var i=0;i<n;i++){sliders[i].value=vals[i];spans[i].textContent=vals[i]+'%'}
var check=0;for(var i=0;i<n;i++) check+=vals[i];
totEl.textContent=check;
}

for(var i=0;i<n;i++) sliders[i].oninput=function(){rebalance(+this.getAttribute('data-i'))};

cn.querySelector('.sb').onclick=function(){
var po={},best=0,pick=q.o[0];
for(var i=0;i<n;i++){po[q.o[i]]=vals[i];if(vals[i]>best){best=vals[i];pick=q.o[i]}}
var v=g(S);v[q.id]=pick;w(S,v);
var t=g(T);if(!t[q.id])t[q.id]={};t[q.id][pick]=(t[q.id][pick]||0)+1;w(T,t);
var p=g(P);p[q.id]=po;w(P,p);
var txt=cn.querySelector('.ri').value.trim();
if(txt){var r=g(R);if(!r[q.id])r[q.id]=[];r[q.id].push({t:txt,v:pick,d:Date.now()});w(R,r)}
refresh(q);
}}

function results(q,cn){
cn.innerHTML='';
var tally=(g(T)[q.id])||{},tot=0,mp=g(P)[q.id],mv=g(S)[q.id],rats=(g(R)[q.id])||[];
for(var k in tally) tot+=tally[k];
if(mp){
var best=0,blbl=q.o[0];
for(var j=0;j<q.o.length;j++){if((mp[q.o[j]]||0)>best){best=mp[q.o[j]];blbl=q.o[j]}}
var d=document.createElement('div');d.className='cr';
d.innerHTML='<span class="cv">'+best+'%</span><span class="ci"><b>Crowd Forecast: '+e(blbl)+'</b><br>'+tot+' forecaster'+(tot!==1?'s':'')+'</span>';
cn.appendChild(d);
}
for(var i=0;i<q.o.length;i++){
var opt=q.o[i],pct=(mp&&mp[opt]!=null)?mp[opt]:(tot>0?Math.round((tally[opt]||0)/tot*100):0);
var row=document.createElement('div');row.className='rw';
row.innerHTML='<span class="rl">'+e(opt)+'</span><div class="rt"><div class="rb b'+(i%5)+'" style="width:0%"></div></div><span class="rp">'+pct+'%</span>';
cn.appendChild(row);
(function(r,p){setTimeout(function(){r.querySelector('.rb').style.width=p+'%'},50)})(row,pct);
}
if(rats.length){
for(var r=rats.length-1;r>=0;r--){
var rd=document.createElement('div');rd.className='rm';
rd.innerHTML=e(rats[r].t)+'<small>'+e(rats[r].v)+' &middot; '+new Date(rats[r].d).toLocaleDateString()+'</small>';
cn.appendChild(rd);
}}
var ft=document.createElement('div');ft.className='ff';
ft.innerHTML='<span class="fv">'+tot+' forecast'+(tot!==1?'s':'')+'</span><span class="fy">You: '+e(mv||'-')+'</span><button class="fg">Change</button>';
ft.querySelector('.fg').onclick=function(){
var v=g(S),old=v[q.id];
if(old){var t=g(T);if(t[q.id]&&t[q.id][old])t[q.id][old]=Math.max(0,t[q.id][old]-1);w(T,t)}
delete v[q.id];w(S,v);var p=g(P);delete p[q.id];w(P,p);refresh(q);
};
cn.appendChild(ft);
}

function refresh(q){
var c=document.getElementById('fw-'+q.id);if(!c)return;
var v=g(S),p=g(P),voted=v[q.id]!=null||p[q.id]!=null;
c.querySelector('.fl').textContent=voted?'Community Forecast':'What do you think?';
var cn=c.querySelector('.cn');cn.innerHTML='';
voted?results(q,cn):voting(q,cn);
}
})();
</script>
